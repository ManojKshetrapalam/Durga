<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sacredBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#802735"/>
      <stop offset="100%" stop-color="#540317"/>
    </radialGradient>
    <radialGradient id="flameGrad" cx="50%" cy="80%" r="70%">
