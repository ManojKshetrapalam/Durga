<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sri Durga Devi Temple — Digital Mandapa</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <meta name="description" content="Digital devotee front desk, daily Vedic Panchanga, Darshan timings, and Seva bookings for Sri Durga Parameshwari Temple, Chandra Layout.">
  <meta name="theme-color" content="#721C2B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Durga Mandapa">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">

  <!-- Cache Invalidation & Network Refresh -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Force SW Update & Client Activation Script -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        for (const reg of regs) {
          reg.update();
        }
      });
    }
  </script>

  <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- App Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css?v=20261007_11">
  <link rel="stylesheet" href="css/app.css?v=20261007_11">
</head>
<body>
  <!-- Header bar with link back to Landing Page on desktop -->
  <div class="desktop-only-bar" style="background: var(--color-primary); color: #FFF; text-align: center; font-size: 0.75rem; padding: 6px 12px; display: flex; justify-content: space-between; align-items: center;">
    <span>🪔 Digital Devotee Front Desk</span>
    <a href="index.html" style="color: var(--color-gold); text-decoration: none; font-weight: 700;">🌐 View Temple Landing Page →</a>
  </div>

  <div id="app-shell">
    <!-- Initial Loading State -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center;">
      <div style="width: 56px; height: 56px; border-radius: 50%; background: #721C2B; display: flex; align-items: center; justify-content: center; color: #C59B27; font-size: 26px; box-shadow: 0 4px 16px rgba(114, 28, 43, 0.25);">
        🪔
      </div>
      <div>
        <h1 style="font-family: 'Playfair Display', serif; font-size: 1.4rem; color: #721C2B; margin-bottom: 4px;">Sri Durga Devi Temple</h1>
        <p style="font-size: 0.85rem; color: #78716C;">Digital Mandapa Devotee Front Desk</p>
      </div>
      <div style="font-size: 0.8rem; color: #D95D0F; font-weight: 600;">
        Om Sri Durgayai Namaha 🙏
      </div>
    </div>
  </div>

  <div id="toast-container" aria-live="polite"></div>

  <!-- Main ES Module Entrypoint -->
  <script type="module" src="js/app.js?v=20261007_11"></script>
</body>
</html>
