<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trustee & Archaka Administrative Desk — Sri Durga Parameshwari Temple</title>
  
  <meta name="description" content="Administrative control portal for Sri Durga Devi Temple trustees and archakas. Date availability management, seva pricing, and WhatsApp booking desk.">
  <meta name="theme-color" content="#721C2B">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">

  <!-- Cache Invalidation & Network Refresh -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- Force SW Update & Client Activation Script -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        for (const reg of regs) {
          reg.update();
        }
      });
    }
  </script>

  <!-- Google Fonts: Playfair Display & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core App Tokens & Admin Styles -->
  <link rel="stylesheet" href="css/tokens.css?v=20261007_11">
  <link rel="stylesheet" href="css/app.css?v=20261007_11">
  <link rel="stylesheet" href="css/admin.css?v=20261007_11">
</head>
<body class="admin-body">
  <div id="admin-root">
    <!-- Initial Loading State -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center;">
      <div style="width: 56px; height: 56px; border-radius: 50%; background: #721C2B; display: flex; align-items: center; justify-content: center; color: #C59B27; font-size: 26px; box-shadow: 0 4px 16px rgba(114, 28, 43, 0.25);">
        🪔
      </div>
      <div>
        <h1 style="font-family: 'Playfair Display', serif; font-size: 1.4rem; color: #721C2B; margin-bottom: 4px;">Sri Durga Devi Temple</h1>
        <p id="loading-desc" style="font-size: 0.85rem; color: #78716C;">Loading Administrative Desk...</p>
      </div>
      <div id="stuck-rescue-btn" style="display: none; margin-top: 12px;">
        <button onclick="localStorage.removeItem('sdd_admin_session'); window.location.reload();" style="padding: 10px 18px; background: #721C2B; color: #FFF; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.85rem; box-shadow: 0 2px 8px rgba(0,0,0,0.15);">
          🔄 Reset Session & Open Login
        </button>
      </div>
    </div>
  </div>

  <div id="toast-container" aria-live="polite"></div>

  <!-- Watchdog fallback: reveals rescue button if browser/cache delays module execution -->
  <script>
    setTimeout(function() {
      var rescue = document.getElementById('stuck-rescue-btn');
      var desc = document.getElementById('loading-desc');
      if (rescue && desc) {
        rescue.style.display = 'block';
        desc.textContent = 'Taking longer than expected?';
      }
    }, 2500);
  </script>

  <!-- Admin Controller Entrypoint -->
  <script type="module" src="js/adminApp.js?v=20261010_17"></script>
</body>
</html>
